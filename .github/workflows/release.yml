name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
concurrency:
  group: tiny-planner-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  release:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public repository with Git
        run: |
          set -euo pipefail
          git init .
          git -c credential.helper= -c core.askPass= fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - run: npm run verify:build
      - run: npm run check
      - run: npm run verify:build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (require("./manifest.json").version !== process.env.RELEASE_TAG) throw new Error("Tag must match manifest version")'
      # Attest the exact assets the Obsidian updater will download.
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_error=$(mktemp)
          trap 'rm -f "$release_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /dev/null 2> "$release_error"; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" main.js manifest.json styles.css --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Tiny Planner $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft=false
          elif [[ "$(cat "$release_error")" == *"(HTTP 404)"* ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" main.js manifest.json styles.css --verify-tag --title "Tiny Planner $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            cat "$release_error" >&2
            exit 1
          fi

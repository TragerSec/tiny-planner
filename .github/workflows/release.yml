name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public repository with Git
        run: |
          set -euo pipefail
          git init .
          git -c credential.helper= -c core.askPass= fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - run: npm run verify:build
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (require("./manifest.json").version !== process.env.RELEASE_TAG) throw new Error("Tag must match manifest version")'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md --verify-tag --title "Tiny Planner $RELEASE_TAG" --notes-file RELEASE_NOTES.md

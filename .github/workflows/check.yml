name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public repository with Git
        run: |
          set -euo pipefail
          git init .
          git -c credential.helper= -c core.askPass= fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      # Keep strict committed-bundle checks on PRs and feature branches.
      # On the default branch the generated file is updated by the sync job below.
      - name: Verify committed main.js on PRs and non-default branches
        if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: npm run verify:build
      - name: Build main.js for the default branch
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: npm run build
      - run: npm run check
      - run: npm run verify:build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser

  sync-generated-bundle:
    # Only a successful default-branch push can commit a generated file.
    # The write token is never exposed to pull-request code.
    needs: check
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the checked commit without credentials
        run: |
          set -euo pipefail
          git init .
          git -c credential.helper= -c core.askPass= fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Rebuild and verify reproducibility
        run: |
          npm run build
          npm run verify:build
      - name: Commit generated main.js if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/main.js?ref=$GITHUB_REF_NAME" --jq '.sha')"
          LOCAL_SHA="$(git hash-object main.js)"
          if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
            echo 'Generated main.js already matches the current default branch.'
            exit 0
          fi
          # The content is too large for a shell command-line argument.
          python3 - "$REMOTE_SHA" "$GITHUB_REF_NAME" <<'PYTHON'
          import base64
          import json
          from pathlib import Path
          import sys
          payload = {
              'message': 'Build main.js from TypeScript source (1.0.2)',
              'branch': sys.argv[2],
              'sha': sys.argv[1],
              'content': base64.b64encode(Path('main.js').read_bytes()).decode('ascii'),
          }
          Path('/tmp/tiny-planner-generated-main-update.json').write_text(json.dumps(payload))
          PYTHON
          gh api "repos/$GITHUB_REPOSITORY/contents/main.js" \
            --method PUT \
            --input /tmp/tiny-planner-generated-main-update.json \
            --silent
          echo 'Generated main.js committed to the default branch.'
